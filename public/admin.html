<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lead Desk</title>
<style>
  :root {
    --bg:#f6f3ee; --surface:#ffffff; --ink:#211d19; --muted:#7b7369; --line:#ebe5dc; --soft:#faf7f2; --hover:#f3eee7;
    --brand:#b4532a; --brand-ink:#ffffff; --brand-soft:#f9ebe3; --brand-deep:#8f3f1e;
    --new:#64748b; --new-bg:#eef1f5;
    --talk:#2563eb; --talk-bg:#e8effd;
    --active:#15803d; --active-bg:#e2f4e8;
    --nurture:#b45309; --nurture-bg:#fdf0d8;
    --nofit:#be123c; --nofit-bg:#fde8ec;
    --human:#7c3aed; --human-bg:#efe8fd;
    --urgent:#dc2626; --urgent-bg:#fee9e9;
    --shadow:0 1px 2px rgba(33,29,25,.04), 0 8px 24px rgba(33,29,25,.05);
    --shadow-lg:0 20px 60px rgba(33,29,25,.18);
    --r:16px; --r-sm:10px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg:#14120f; --surface:#1d1a16; --ink:#f1ece4; --muted:#a0988c; --line:#322d26; --soft:#221f1a; --hover:#27231d;
      --brand:#e07a4b; --brand-ink:#1a0e07; --brand-soft:#3a2418; --brand-deep:#f0a07c;
      --new:#94a3b8; --new-bg:#262b33; --talk:#7aa2f7; --talk-bg:#1f2a44; --active:#4ade80; --active-bg:#173322;
      --nurture:#fbbf24; --nurture-bg:#3a2d10; --nofit:#fb7185; --nofit-bg:#3d1822; --human:#a78bfa; --human-bg:#2c2347;
      --urgent:#f87171; --urgent-bg:#3d1b1b; --shadow:none; --shadow-lg:0 20px 60px rgba(0,0,0,.5);
    }
  }
  * { box-sizing:border-box; }
  html,body { height:100%; }
  body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.5 "Inter","SF Pro Text","Segoe UI",system-ui,-apple-system,Roboto,sans-serif; display:flex; -webkit-font-smoothing:antialiased; }
  button { font:inherit; cursor:pointer; color:inherit; }
  a { color:var(--brand); }
  input,select,textarea { font:inherit; color:var(--ink); background:var(--surface); border:1px solid var(--line); border-radius:var(--r-sm); padding:10px 12px; width:100%; outline:none; transition:border-color .15s, box-shadow .15s; }
  input:focus,select:focus,textarea:focus { border-color:var(--brand); box-shadow:0 0 0 4px color-mix(in srgb, var(--brand) 16%, transparent); }
  textarea { resize:vertical; min-height:72px; }
  label.f { display:block; font-size:13px; font-weight:600; color:var(--muted); margin:14px 0 6px; }
  .help { font-size:13px; color:var(--muted); margin-top:4px; }
  .mute { color:var(--muted); }
  h1 { font-size:26px; line-height:1.2; margin:0; letter-spacing:-.02em; }
  h2 { font-size:18px; margin:0; letter-spacing:-.01em; }
  h3 { font-size:15px; margin:0; }

  .btn { display:inline-flex; align-items:center; justify-content:center; gap:8px; border:1px solid var(--line); background:var(--surface); padding:9px 15px; border-radius:var(--r-sm); font-weight:600; font-size:14px; transition:background .15s, border-color .15s, transform .05s; white-space:nowrap; text-decoration:none; color:var(--ink); }
  .btn:hover { background:var(--hover); }
  .btn:active { transform:translateY(1px); }
  .btn.primary { background:var(--brand); border-color:var(--brand); color:var(--brand-ink); }
  .btn.primary:hover { background:var(--brand-deep); border-color:var(--brand-deep); color:#fff; }
  .btn.ghost { border-color:transparent; background:transparent; color:var(--muted); }
  .btn.ghost:hover { background:var(--hover); color:var(--ink); }
  .btn.danger { color:var(--nofit); }
  .btn.sm { padding:6px 11px; font-size:13px; }
  .btn:disabled { opacity:.45; cursor:not-allowed; }
  svg.i { width:18px; height:18px; stroke:currentColor; fill:none; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; flex-shrink:0; }
  svg.i.sm { width:15px; height:15px; }

  .card { background:var(--surface); border:1px solid var(--line); border-radius:var(--r); padding:20px; box-shadow:var(--shadow); }
  .row { display:flex; align-items:center; gap:12px; flex-wrap:wrap; }
  .grow { flex:1; min-width:0; }
  .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:0 16px; }
  .stack > * + * { margin-top:18px; }

  .pill { display:inline-flex; align-items:center; gap:6px; padding:3px 11px; border-radius:99px; font-size:12.5px; font-weight:700; line-height:1.4; white-space:nowrap; }
  .pill.new { background:var(--new-bg); color:var(--new); } .pill.qualifying { background:var(--talk-bg); color:var(--talk); }
  .pill.active { background:var(--active-bg); color:var(--active); } .pill.nurture { background:var(--nurture-bg); color:var(--nurture); }
  .pill.disqualified { background:var(--nofit-bg); color:var(--nofit); } .pill.human { background:var(--human-bg); color:var(--human); }
  .pill.urgent { background:var(--urgent-bg); color:var(--urgent); }
  .pill.soon { background:var(--nurture-bg); color:var(--nurture); }
  .pill.plain { background:var(--soft); color:var(--muted); border:1px solid var(--line); font-weight:600; }
  .dot { width:8px; height:8px; border-radius:50%; background:var(--muted); display:inline-block; }
  .dot.ok { background:var(--active); } .dot.bad { background:var(--nofit); } .dot.warn { background:var(--nurture); }
  .avatar { width:38px; height:38px; border-radius:50%; display:grid; place-items:center; font-weight:700; font-size:14px; flex-shrink:0; background:var(--brand-soft); color:var(--brand-deep); }
  .avatar.lg { width:54px; height:54px; font-size:19px; }

  aside { width:236px; background:var(--surface); border-right:1px solid var(--line); padding:22px 14px; display:flex; flex-direction:column; flex-shrink:0; }
  .brand { display:flex; align-items:center; gap:11px; padding:2px 10px 22px; }
  .brand .mark { width:36px; height:36px; border-radius:11px; background:var(--brand); color:var(--brand-ink); display:grid; place-items:center; font-weight:800; font-size:17px; }
  .brand b { display:block; font-size:16px; letter-spacing:-.01em; }
  .brand small { color:var(--muted); font-size:12px; }
  nav button { display:flex; align-items:center; gap:12px; width:100%; text-align:left; background:none; border:0; padding:10px 12px; margin-bottom:3px; border-radius:11px; font-weight:600; color:var(--muted); position:relative; }
  nav button:hover { background:var(--hover); color:var(--ink); }
  nav button.on { background:var(--brand-soft); color:var(--brand-deep); }
  nav .badge { margin-left:auto; background:var(--urgent); color:#fff; font-size:12px; font-weight:700; min-width:22px; height:22px; border-radius:11px; display:grid; place-items:center; padding:0 6px; }
  .side-foot { margin-top:auto; padding:12px; font-size:13px; color:var(--muted); line-height:2; border-top:1px solid var(--line); }
  main { flex:1; min-width:0; height:100vh; overflow:auto; }
  .page { max-width:1320px; margin:0 auto; padding:30px 32px 80px; }
  .page-head { display:flex; align-items:flex-end; gap:12px; flex-wrap:wrap; margin-bottom:24px; }
  .page-head p { margin:6px 0 0; color:var(--muted); }

  .tiles { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:16px; margin-bottom:24px; }
  .tile { background:var(--surface); border:1px solid var(--line); border-radius:var(--r); padding:18px 20px; box-shadow:var(--shadow); text-align:left; }
  .tile .n { font-size:34px; font-weight:800; letter-spacing:-.03em; line-height:1.1; }
  .tile .l { color:var(--muted); font-weight:600; font-size:14px; margin-top:4px; }
  .tile.alert { border-color:color-mix(in srgb, var(--urgent) 35%, var(--line)); background:var(--urgent-bg); }
  .tile.alert .n { color:var(--urgent); }
  .two { display:grid; grid-template-columns:minmax(0,1.5fr) minmax(0,1fr); gap:20px; align-items:start; }
  .section-title { display:flex; align-items:center; gap:10px; margin:0 0 12px; }
  .count { background:var(--soft); border:1px solid var(--line); color:var(--muted); border-radius:99px; font-size:12.5px; font-weight:700; padding:1px 9px; }
  .item { display:flex; align-items:center; gap:14px; padding:14px 16px; border:1px solid var(--line); border-radius:14px; background:var(--surface); margin-bottom:10px; cursor:pointer; transition:box-shadow .15s, transform .15s; }
  .item:hover { box-shadow:var(--shadow); transform:translateY(-1px); }
  .item.urgent { border-left:4px solid var(--urgent); }
  .item.soon { border-left:4px solid var(--nurture); }
  .item .t { font-weight:700; }
  .item .s { color:var(--muted); font-size:13.5px; }
  .empty { text-align:center; color:var(--muted); padding:28px 12px; border:1.5px dashed var(--line); border-radius:14px; }
  .empty b { display:block; color:var(--ink); margin-bottom:2px; }
  .timeline .ev { display:flex; gap:12px; padding:9px 0; font-size:14px; }
  .timeline .ev .dot { margin-top:7px; }
  .funnel .bar { display:flex; align-items:center; gap:10px; margin:10px 0; font-size:14px; }
  .funnel .bar span.name { width:104px; color:var(--muted); font-weight:600; }
  .funnel .bar .track { flex:1; height:10px; background:var(--soft); border-radius:99px; overflow:hidden; border:1px solid var(--line); }
  .funnel .bar .fill { height:100%; border-radius:99px; }
  .funnel .bar b { width:28px; text-align:right; }

  .toolbar { display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin-bottom:18px; }
  .chips { display:flex; gap:6px; flex-wrap:wrap; }
  .chip { border:1px solid var(--line); background:var(--surface); border-radius:99px; padding:6px 14px; font-weight:600; font-size:13.5px; color:var(--muted); }
  .chip.on { background:var(--ink); color:var(--bg); border-color:var(--ink); }
  .search { position:relative; width:260px; }
  .search input { padding-left:38px; }
  .search svg { position:absolute; left:12px; top:50%; transform:translateY(-50%); color:var(--muted); }
  .board-wrap { overflow-x:auto; margin:0 -32px; padding:0 32px 10px; }
  .board { display:grid; grid-template-columns:repeat(6,minmax(250px,1fr)); gap:14px; min-width:1560px; align-items:start; }
  .col { background:color-mix(in srgb, var(--soft) 70%, transparent); border:1px solid var(--line); border-radius:var(--r); padding:12px; min-height:200px; }
  .col.urgent { background:var(--urgent-bg); border-color:color-mix(in srgb, var(--urgent) 30%, var(--line)); }
  .col-head { display:flex; align-items:center; gap:8px; padding:2px 4px 3px; }
  .col-head b { font-size:14px; }
  .col-head .count { margin-left:auto; background:var(--surface); }
  .col-sub { font-size:12.5px; color:var(--muted); padding:0 4px 10px; }
  .lead { background:var(--surface); border:1px solid var(--line); border-radius:13px; padding:12px 13px; margin-bottom:10px; cursor:pointer; transition:box-shadow .15s, transform .15s; box-shadow:var(--shadow); }
  .lead:hover { transform:translateY(-2px); box-shadow:0 10px 28px rgba(33,29,25,.1); }
  .lead .top { display:flex; align-items:center; gap:10px; }
  .lead .nm { font-weight:700; line-height:1.2; }
  .lead .sub { color:var(--muted); font-size:13px; }
  .lead .tags { display:flex; flex-wrap:wrap; gap:6px; margin-top:9px; }
  .tag { display:inline-flex; align-items:center; gap:5px; font-size:12.5px; background:var(--soft); border:1px solid var(--line); padding:2px 9px; border-radius:99px; color:var(--muted); font-weight:600; }
  .tag.call { background:var(--active-bg); color:var(--active); border-color:transparent; }
  .tag.warn { background:var(--urgent-bg); color:var(--urgent); border-color:transparent; }
  .lead .alertline { margin-top:9px; font-size:13px; color:var(--urgent); font-weight:600; display:flex; gap:6px; align-items:flex-start; }
  .lead .reddot { width:9px; height:9px; border-radius:50%; background:var(--urgent); flex-shrink:0; }

  table.list { width:100%; border-collapse:separate; border-spacing:0; background:var(--surface); border:1px solid var(--line); border-radius:var(--r); overflow:hidden; }
  table.list th { text-align:left; font-size:12.5px; color:var(--muted); font-weight:700; padding:12px 16px; background:var(--soft); border-bottom:1px solid var(--line); }
  table.list td { padding:12px 16px; border-bottom:1px solid var(--line); font-size:14px; vertical-align:middle; }
  table.list tr:last-child td { border-bottom:0; }
  table.list tr.click { cursor:pointer; } table.list tr.click:hover td { background:var(--hover); }

  .daygroup { margin-bottom:26px; }
  .daygroup h3 { margin-bottom:10px; display:flex; gap:10px; align-items:center; }
  .callrow { display:grid; grid-template-columns:110px minmax(0,1fr) auto; gap:16px; align-items:center; padding:14px 18px; background:var(--surface); border:1px solid var(--line); border-radius:14px; margin-bottom:10px; cursor:pointer; }
  .callrow:hover { box-shadow:var(--shadow); }
  .callrow .time { font-weight:800; font-size:17px; letter-spacing:-.01em; }
  .callrow .time small { display:block; font-weight:600; color:var(--muted); font-size:12.5px; }
  .callrow.over { border-left:4px solid var(--urgent); }

  .scrim { position:fixed; inset:0; background:rgba(20,17,13,.45); backdrop-filter:blur(2px); display:none; z-index:30; }
  .scrim.open { display:block; }
  .drawer { position:fixed; top:0; right:0; bottom:0; width:min(680px,100vw); background:var(--bg); z-index:31; transform:translateX(100%); transition:transform .25s cubic-bezier(.2,.8,.2,1); display:flex; flex-direction:column; box-shadow:var(--shadow-lg); }
  .drawer.open { transform:none; }
  .d-head { padding:22px 26px 16px; background:var(--surface); border-bottom:1px solid var(--line); }
  .d-body { flex:1; overflow:auto; padding:22px 26px 60px; }
  .ring { width:54px; height:54px; border-radius:50%; display:grid; place-items:center; font-weight:800; flex-shrink:0; }
  .ring span { background:var(--surface); width:42px; height:42px; border-radius:50%; display:grid; place-items:center; font-size:15px; }
  .next { border-radius:14px; padding:14px 16px; margin-bottom:12px; display:flex; gap:12px; align-items:flex-start; }
  .next.urgent { background:var(--urgent-bg); border:1px solid color-mix(in srgb, var(--urgent) 35%, var(--line)); }
  .next.soon { background:var(--nurture-bg); border:1px solid color-mix(in srgb, var(--nurture) 30%, var(--line)); }
  .next.ok { background:var(--active-bg); border:1px solid color-mix(in srgb, var(--active) 25%, var(--line)); }
  .next b { display:block; }
  .glance { background:var(--brand-soft); border-radius:14px; padding:14px 16px; line-height:1.55; }
  .facts { display:grid; grid-template-columns:1fr 1fr; gap:0 18px; }
  .sec { margin-top:26px; }
  .sec > h3 { margin-bottom:10px; font-size:15px; display:flex; align-items:center; gap:8px; }
  .chat { background:var(--soft); border:1px solid var(--line); border-radius:var(--r); padding:14px; max-height:420px; overflow:auto; display:flex; flex-direction:column; gap:10px; }
  .msg { max-width:80%; padding:9px 13px; border-radius:16px; white-space:pre-wrap; word-wrap:break-word; font-size:14.5px; line-height:1.45; }
  .msg small { display:block; font-size:11.5px; opacity:.7; margin-top:3px; }
  .msg.in { align-self:flex-start; background:var(--surface); border:1px solid var(--line); border-bottom-left-radius:5px; }
  .msg.bot { align-self:flex-end; background:var(--brand); color:var(--brand-ink); border-bottom-right-radius:5px; }
  .msg.you { align-self:flex-end; background:var(--human); color:#fff; border-bottom-right-radius:5px; }
  .msg.pending { opacity:.6; } .msg.failed { outline:2px solid var(--urgent); }
  .banner { display:flex; gap:10px; align-items:flex-start; padding:11px 14px; border-radius:12px; font-size:13.5px; margin-bottom:10px; }
  .banner.ok { background:var(--active-bg); } .banner.warn { background:var(--nurture-bg); } .banner.bad { background:var(--urgent-bg); }
  .acts { display:flex; flex-wrap:wrap; gap:8px; margin-top:12px; }
  details.more { margin-top:26px; border:1px solid var(--line); border-radius:14px; padding:4px 16px; background:var(--surface); }
  details.more summary { padding:12px 0; font-weight:700; cursor:pointer; color:var(--muted); }
  .ev2 { font-size:14px; padding:8px 0; border-bottom:1px dashed var(--line); display:flex; justify-content:space-between; gap:10px; }

  .set-grid { display:grid; grid-template-columns:210px minmax(0,1fr); gap:28px; align-items:start; }
  .subnav { position:sticky; top:20px; }
  .subnav button { display:block; width:100%; text-align:left; background:none; border:0; padding:10px 14px; border-radius:10px; font-weight:600; color:var(--muted); margin-bottom:2px; }
  .subnav button.on { background:var(--surface); color:var(--ink); box-shadow:var(--shadow); }
  .subnav button:hover { color:var(--ink); }
  .bigmoney { font-size:44px; font-weight:800; letter-spacing:-.03em; color:var(--brand-deep); }
  input[type=range] { padding:0; border:0; box-shadow:none !important; accent-color:var(--brand); height:28px; }
  .stackbar { display:flex; height:30px; border-radius:10px; overflow:hidden; background:var(--soft); border:1px solid var(--line); }
  .stackbar div { display:grid; place-items:center; color:#fff; font-size:12.5px; font-weight:700; min-width:0; }
  .moved { max-height:170px; overflow:auto; font-size:14px; margin-top:10px; }
  .moved div { padding:5px 0; border-bottom:1px dashed var(--line); }
  .chk { display:flex; flex-wrap:wrap; gap:8px 18px; }
  .chk label { display:flex; align-items:center; gap:8px; font-weight:500; cursor:pointer; }
  .chk input, .tog input { width:auto; }
  .tog { display:flex; align-items:center; gap:10px; cursor:pointer; font-weight:500; }
  code { background:var(--soft); border:1px solid var(--line); padding:2px 8px; border-radius:7px; font-size:13px; word-break:break-all; display:inline-block; }
  .kv { display:grid; grid-template-columns:150px 1fr; gap:8px 12px; font-size:14px; }
  .kv dt { color:var(--muted); } .kv dd { margin:0; }

  .toast { position:fixed; bottom:26px; left:50%; transform:translate(-50%,30px); background:var(--ink); color:var(--bg); padding:12px 20px; border-radius:12px; z-index:80; opacity:0; transition:all .25s; font-weight:600; max-width:90vw; pointer-events:none; }
  .toast.show { opacity:1; transform:translate(-50%,0); }
  .toast.bad { background:var(--urgent); color:#fff; }
  .login { position:fixed; inset:0; background:var(--bg); z-index:100; display:none; align-items:center; justify-content:center; padding:20px; }
  .login .card { width:100%; max-width:380px; padding:32px; }

  .tabbar { display:none; }
  @media (max-width: 960px) {
    aside { display:none; }
    .tabbar { display:flex; position:fixed; bottom:0; left:0; right:0; background:var(--surface); border-top:1px solid var(--line); z-index:20; padding:6px 6px calc(6px + env(safe-area-inset-bottom)); }
    .tabbar button { flex:1; background:none; border:0; display:flex; flex-direction:column; align-items:center; gap:2px; padding:6px 2px; font-size:11.5px; font-weight:600; color:var(--muted); position:relative; }
    .tabbar button.on { color:var(--brand-deep); }
    .tabbar .badge { position:absolute; top:0; right:22%; background:var(--urgent); color:#fff; font-size:11px; border-radius:9px; min-width:18px; height:18px; display:grid; place-items:center; }
    .page { padding:20px 16px 110px; }
    .tiles { grid-template-columns:repeat(2,1fr); }
    .two, .set-grid, .grid2, .facts { grid-template-columns:1fr; }
    .subnav { position:static; display:flex; gap:6px; overflow-x:auto; margin-bottom:6px; }
    .subnav button { width:auto; white-space:nowrap; }
    .board-wrap { margin:0 -16px; padding:0 16px 10px; }
    .callrow { grid-template-columns:84px minmax(0,1fr); } .callrow > :last-child { grid-column:1 / -1; }
    .search { width:100%; }
  }
</style>
</head>
<body>
<div class="login" id="login">
  <div class="card">
    <div class="brand" style="padding:0 0 18px"><div class="mark">L</div><div><b>Lead Desk</b><small>Sign in to continue</small></div></div>
    <label class="f" for="pw" style="margin-top:0">Password</label>
    <input id="pw" type="password" autocomplete="current-password">
    <div id="loginErr" style="color:var(--urgent);min-height:22px;margin-top:8px;font-size:14px"></div>
    <button class="btn primary" style="width:100%" id="loginBtn">Sign in</button>
  </div>
</div>

<aside>
  <div class="brand"><div class="mark">L</div><div><b>Lead Desk</b><small id="bizName">Your leads, handled</small></div></div>
  <nav id="nav"></nav>
  <div class="side-foot" id="foot"></div>
</aside>
<main><div class="page" id="page"></div></main>
<div class="tabbar" id="tabbar"></div>
<div class="scrim" id="scrim"></div>
<div class="drawer" id="drawer" aria-hidden="true"></div>
<div class="toast" id="toast"></div>

<script>
'use strict';
const $ = (s, r = document) => r.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

// ---------- icons ----------
const P = {
  today: '<path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/><path d="M10 20v-6h4v6"/>',

const STAGES = ['new', 'qualifying', 'active', 'nurture', 'disqualified', 'human'];
const S = {
  new: { label: 'New', hint: 'Just arrived, no reply yet', color: 'new' },

// ---------- api / helpers ----------
async function api(path, opts = {}) {
  const res = await fetch(path, { method: opts.method || 'GET', headers: opts.body ? { 'Content-Type': 'application/json' } : {}, body: opts.body ? JSON.stringify(opts.body) : undefined });
  if (res.status === 401) { showLogin(); throw new Error('Please sign in again'); }
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || `Something went wrong (${res.status})`);
  return data;
}
let toastTimer;
function toast(msg, bad) { const t = $('#toast'); t.textContent = msg; t.className = `toast show${bad ? ' bad' : ''}`; clearTimeout(toastTimer); toastTimer = setTimeout(() => { t.className = 'toast'; }, 3200); }
const act = (fn) => async (...a) => { try { await fn(...a); } catch (e) { toast(e.message, true); } };
const tz = () => (state.boot && state.boot.settings.business.timezone) || 'Asia/Kolkata';
const cur = () => (state.boot ? state.boot.settings.qualification.currency : 'INR');
function money(v) {
  if (v === null || v === undefined || v === '') return '';
  const n = Number(v);
  const t = (x) => String(Math.round(x * 100) / 100);
  if (cur() === 'INR') { if (n >= 1e7) return `₹${t(n / 1e7)} Cr`; if (n >= 1e5) return `₹${t(n / 1e5)} L`; if (n >= 1e3) return `₹${t(n / 1e3)}k`; return `₹${n}`; }
  const sym = { USD: '$', EUR: '€', GBP: '£' }[cur()] || cur() + ' ';
  if (n >= 1e6) return `${sym}${t(n / 1e6)}M`; if (n >= 1e3) return `${sym}${t(n / 1e3)}k`; return `${sym}${n}`;
}
function dayKey(ts) { return new Intl.DateTimeFormat('en-CA', { timeZone: tz() }).format(ts); }
function whenText(ts, withDay = true) {
  if (!ts) return '';
  const now = Date.now();
  const diff = Math.round((new Date(dayKey(ts)) - new Date(dayKey(now))) / 86400000);
  const rel = diff === 0 ? 'Today' : diff === 1 ? 'Tomorrow' : diff === -1 ? 'Yesterday' : '';
  const date = new Intl.DateTimeFormat('en-GB', { timeZone: tz(), weekday: 'short', day: 'numeric', month: 'short' }).format(ts);
  const time = new Intl.DateTimeFormat('en-US', { timeZone: tz(), hour: 'numeric', minute: '2-digit', hour12: true }).format(ts);
  return withDay ? `${rel ? `${rel}, ` : ''}${date}, ${time}` : time;
}
function ago(ts) {
  if (!ts) return '';
  const s = Math.max(1, Math.round((Date.now() - ts) / 1000));
  if (s < 60) return 'just now'; if (s < 3600) return `${Math.round(s / 60)} min ago`; if (s < 86400) return `${Math.round(s / 3600)} hr ago`; return `${Math.round(s / 86400)} days ago`;
}
function toLocalInput(ts) { return ts ? new Intl.DateTimeFormat('sv-SE', { timeZone: tz(), year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', hour12: false }).format(ts).replace(' ', 'T') : ''; }
const initials = (n) => (String(n || '?').trim().split(/\s+/).slice(0, 2).map((w) => w[0]).join('') || '?').toUpperCase();
const projectLine = (l) => [l.scope || l.project_type, l.city].filter(Boolean).join(' in ') || 'Details coming';
const timelineOf = (l) => l.timeline_text || (l.timeline_months != null ? `${l.timeline_months} months` : '');
const channelName = (l) => (l.channel === 'instagram' ? 'Instagram' : l.channel === 'telegram' ? 'Telegram' : 'Practice');
const urgentOf = (l) => (l.attention || []).find((a) => a.level === 'urgent');
const isUrgent = (l) => l.stage === 'human' || !!urgentOf(l);
const stageVar = (s) => `var(--${S[s].color})`;

// ---------- shell ----------
const NAV = [['today', 'Today', 'today'], ['leads', 'Leads', 'leads'], ['calls', 'Calls', 'calls'], ['chat', 'Try it', 'chat'], ['demo', 'Practice', 'spark'], ['settings', 'Settings', 'gear']];
function urgentCount() { return state.leads.filter(isUrgent).length; }
function renderNav() {
  const n = urgentCount();
  const badge = (id) => (id === 'today' && n ? `<span class="badge">${n}</span>` : '');
  $('#nav').innerHTML = NAV.map(([id, label, icon]) => `<button data-v="${id}" class="${state.view === id ? 'on' : ''}">${ic(icon)}<span>${label}</span>${badge(id)}</button>`).join('');
  $('#tabbar').innerHTML = NAV.filter((x) => x[0] !== 'demo').map(([id, label, icon]) => `<button data-v="${id}" class="${state.view === id ? 'on' : ''}">${ic(icon)}<span>${label}</span>${badge(id)}</button>`).join('');
  document.querySelectorAll('[data-v]').forEach((b) => { b.onclick = () => go(b.dataset.v); });
}
function renderFoot() {
  const s = state.boot && state.boot.status; if (!s) return;
  const ig = s.instagram && s.instagram.enabled ? (s.instagram.connected ? '<span class="dot ok"></span> Instagram connected' : '<span class="dot bad"></span> Instagram offline') : '<span class="dot warn"></span> Instagram not set up';
  const tg = s.telegram.enabled ? (s.telegram.connected ? '<span class="dot ok"></span> Telegram connected' : '<span class="dot bad"></span> Telegram offline') : '';
  const ai = s.llm.enabled ? '<span class="dot ok"></span> Assistant is on' : '<span class="dot bad"></span> Assistant is off';
  $('#foot').innerHTML = `${ig}<br>${tg ? tg + '<br>' : ''}${ai}<br><a href="#" id="logout" style="color:var(--muted)">Sign out</a>`;
  $('#logout').onclick = act(async (e) => { e.preventDefault(); await api('/api/logout', { method: 'POST', body: {} }); location.reload(); });
  $('#bizName').textContent = state.boot.settings.business.name;
}
function go(v) { state.view = v; closeDrawer(); renderNav(); render(); $('main').scrollTop = 0; window.scrollTo(0, 0); }
async function render() { await ({ today: viewToday, leads: viewLeads, calls: viewCalls, chat: viewChat, demo: viewDemo, settings: viewSettings })[state.view](); }

async function loadLeads() {
  const q = new URLSearchParams(); if (!state.includeSim) q.set('sim', '0');
  const d = await api(`/api/leads?${q}`); state.leads = d.leads; renderNav();
}
async function refreshBoot() { state.boot = await api('/api/bootstrap'); renderFoot(); }

// ---------- pieces ----------
function leadCard(l) {
  const u = urgentOf(l) || (l.stage === 'human' ? { title: 'Wants to talk to a person' } : null);
  const tags = [];
  if (l.callback_at) { const late = l.callback_status === 'scheduled' && l.callback_at < Date.now() - 30 * 60000; tags.push(`<span class="tag ${late ? 'warn' : 'call'}">${ic('cal', 'sm')} ${esc(whenText(l.callback_at))}${late ? ' (overdue)' : ''}</span>`); }
  else if (l.callback_text && l.stage === 'active') tags.push(`<span class="tag">${ic('clock', 'sm')} ${esc(l.callback_text)}</span>`);
  if (l.budget_amount != null) tags.push(`<span class="tag">${esc(money(l.budget_amount))}</span>`);
  if (l.designer) tags.push(`<span class="tag">${ic('user', 'sm')} ${esc(l.designer)}</span>`);
  tags.push(`<span class="tag">${esc(channelName(l))}</span>`);
  return `<div class="lead" data-open="${l.id}">
    <div class="top"><div class="avatar">${esc(initials(l.name))}</div><div class="grow"><div class="nm">${esc(l.name || 'Unknown')}</div><div class="sub">${esc(projectLine(l))}</div></div>${isUrgent(l) ? '<span class="reddot" title="Needs you"></span>' : ''}</div>
    <div class="tags">${tags.join('')}</div>
    ${u ? `<div class="alertline">${ic('alert', 'sm')}<span>${esc(u.title)}</span></div>` : ''}
  </div>`;
}
function bindOpen(root) { root.querySelectorAll('[data-open]').forEach((el) => { el.onclick = (e) => { if (e.target.closest('button[data-done]')) return; openLead(Number(el.dataset.open)); }; }); }
function attItem(l) {
  const a = urgentOf(l) || (l.attention || [])[0] || { level: 'urgent', title: 'Wants to talk to a person', detail: '' };
  return `<div class="item ${a.level}" data-open="${l.id}">
    <div class="avatar">${esc(initials(l.name))}</div>
    <div class="grow"><div class="t">${esc(l.name || 'Unknown')} <span class="mute" style="font-weight:500">${esc(projectLine(l))}</span></div><div class="s">${esc(a.title)}${a.detail ? ` &middot; ${esc(a.detail)}` : ''}</div></div>
    <span class="btn sm primary">Open</span>
  </div>`;
}

// ---------- TODAY ----------
async function viewToday() {
  await Promise.all([loadLeads(), api('/api/activity').then((d) => { state.activity = d.items; })]);
  const L = state.leads;
  const urgent = L.filter(isUrgent);
  const soon = L.filter((l) => !isUrgent(l) && (l.attention || []).some((a) => a.level === 'soon'));
  const today = dayKey(Date.now());
  const callsToday = L.filter((l) => l.callback_at && l.callback_status === 'scheduled' && dayKey(l.callback_at) === today);
  const newToday = L.filter((l) => dayKey(l.created_at) === today).length;
  const active = L.filter((l) => l.stage === 'active').length;
  const upcoming = L.filter((l) => l.callback_at && l.callback_status === 'scheduled' && l.callback_at > Date.now() - 3600000).sort((a, b) => a.callback_at - b.callback_at).slice(0, 6);
  const hour = Number(new Intl.DateTimeFormat('en-US', { timeZone: tz(), hour: 'numeric', hour12: false }).format(Date.now())) % 24;
  const hello = hour < 12 ? 'Good morning' : hour < 17 ? 'Good afternoon' : 'Good evening';
  const total = Math.max(1, L.length);
  const funnel = ['new', 'qualifying', 'active', 'nurture', 'disqualified'].map((s) => { const n = L.filter((l) => l.stage === s).length; return `<div class="bar"><span class="name">${S[s].label}</span><div class="track"><div class="fill" style="width:${Math.round((n / total) * 100)}%;background:${stageVar(s)}"></div></div><b>${n}</b></div>`; }).join('');
  $('#page').innerHTML = `
  <div class="page-head"><div class="grow"><h1>${hello}</h1><p>${new Intl.DateTimeFormat('en-GB', { timeZone: tz(), weekday: 'long', day: 'numeric', month: 'long' }).format(Date.now())}. Here is what needs your attention.</p></div>
    <button class="btn primary" id="addLead">${ic('plus')} Add a lead</button></div>
  <div class="tiles">
    <div class="tile ${urgent.length ? 'alert' : ''}"><div class="n">${urgent.length}</div><div class="l">Need you now</div></div>
    <div class="tile"><div class="n">${callsToday.length}</div><div class="l">Calls today</div></div>
    <div class="tile"><div class="n">${active}</div><div class="l">Active leads</div></div>
    <div class="tile"><div class="n">${newToday}</div><div class="l">New today</div></div>
  </div>
  <div class="two">
    <div>
      <div class="section-title"><h2>Needs you now</h2><span class="count">${urgent.length}</span></div>
      ${urgent.length ? urgent.map(attItem).join('') : '<div class="empty"><b>You are all caught up</b>Nothing is waiting on you right now.</div>'}
      ${soon.length ? `<div class="section-title" style="margin-top:26px"><h2>Coming up soon</h2><span class="count">${soon.length}</span></div>${soon.map(attItem).join('')}` : ''}
      <div class="section-title" style="margin-top:26px"><h2>Calls coming up</h2><span class="count">${upcoming.length}</span></div>
      ${upcoming.length ? upcoming.map((l) => `<div class="item" data-open="${l.id}"><div class="avatar">${esc(initials(l.name))}</div><div class="grow"><div class="t">${esc(l.name)}</div><div class="s">${esc(projectLine(l))}${l.designer ? ` &middot; with ${esc(l.designer)}` : ''}</div></div><span class="pill active">${ic('cal', 'sm')} ${esc(whenText(l.callback_at))}</span></div>`).join('') : '<div class="empty"><b>No calls booked yet</b>When a customer picks a time, it shows up here.</div>'}
    </div>
    <div>
      <div class="card"><h2 style="margin-bottom:6px">Your leads</h2><div class="funnel">${funnel}</div></div>
      <div class="card" style="margin-top:20px"><h2 style="margin-bottom:8px">Latest activity</h2><div class="timeline">${state.activity.length ? state.activity.slice(0, 9).map((a) => `<div class="ev"><span class="dot ok"></span><div class="grow"><b>${esc(a.name || 'A lead')}</b> ${esc(activityText(a))}<div class="mute" style="font-size:12.5px">${ago(a.created_at)}</div></div></div>`).join('') : '<div class="empty">Nothing yet.</div>'}</div></div>
    </div>
  </div>`;
  $('#addLead').onclick = openAddLead;
  bindOpen($('#page'));
}
function activityText(a) {
  const d = a.data || {};
  switch (a.type) {
    case 'lead_created': return 'sent an enquiry';
    case 'stage_changed': return `became ${S[d.to] ? S[d.to].label.toLowerCase() : d.to}`;
    case 'designer_assigned': return `was given to ${d.designer}`;
    case 'call_rescheduled': return d.at ? `has a call booked for ${whenText(d.at)}` : 'had the call time cleared';
    case 'followup_done': return 'follow-up marked done';
    case 'followup_snoozed': return 'reminder postponed';
    case 'reminder_sent': return 'was sent a call reminder';
    case 'followup_sent': return 'was sent a gentle nudge';
    case 'manual_followup_needed': return 'needs you to follow up';
    case 'facts_updated': return 'shared more details';
    case 'manual_message': return 'was messaged by you';
    default: return String(a.type).replace(/_/g, ' ');
  }
}

  ];

// ---------- CALLS ----------
async function viewCalls() {
  await loadLeads();
  const L = state.leads.filter((l) => l.stage !== 'disqualified');
  const withTime = L.filter((l) => l.callback_at && l.callback_status === 'scheduled').sort((a, b) => a.callback_at - b.callback_at);
  const done = L.filter((l) => l.callback_status === 'done').slice(0, 8);
  const waiting = L.filter((l) => !l.callback_at && l.stage === 'active');
  const requested = L.filter((l) => !l.callback_at && l.callback_text && l.stage !== 'active');
  const now = Date.now(); const today = dayKey(now); const tomorrow = dayKey(now + 86400000);
  const groups = [
    ['Overdue', withTime.filter((l) => l.callback_at < now - 30 * 60000), true],
    ['Today', withTime.filter((l) => l.callback_at >= now - 30 * 60000 && dayKey(l.callback_at) === today)],
    ['Tomorrow', withTime.filter((l) => dayKey(l.callback_at) === tomorrow)],
    ['Later', withTime.filter((l) => l.callback_at > now && dayKey(l.callback_at) > tomorrow)],
  ];
  const row = (l, over) => `<div class="callrow ${over ? 'over' : ''}" data-open="${l.id}">
    <div class="time">${esc(whenText(l.callback_at, false))}<small>${esc(whenText(l.callback_at).split(',').slice(0, 2).join(','))}</small></div>
    <div class="grow"><div style="font-weight:700">${esc(l.name || 'Unknown')} <span class="mute" style="font-weight:500">${esc(projectLine(l))}</span></div>
      <div class="mute" style="font-size:13.5px">${l.designer ? `With ${esc(l.designer)} &middot; ` : ''}${l.phone ? esc(l.phone) : '<span style="color:var(--urgent)">No phone number yet</span>'}${l.contact_pref ? ` &middot; best time: ${esc(l.contact_pref)}` : ''}</div></div>
    <div class="row">${(l.attention || []).some((a) => a.kind === 'manual') ? '<span class="pill urgent">Message them yourself</span>' : ''}<button class="btn sm" data-done="${l.id}">${ic('check', 'sm')} Done</button><span class="btn sm primary">Open</span></div></div>`;
  $('#page').innerHTML = `
  <div class="page-head"><div class="grow"><h1>Calls</h1><p>Every call a customer has asked for. The assistant reminds them before it happens.</p></div></div>
  ${groups.map(([name, items, over]) => items.length ? `<div class="daygroup"><h3>${name} <span class="count">${items.length}</span></h3>${items.map((l) => row(l, over)).join('')}</div>` : '').join('') || '<div class="empty"><b>No calls booked</b>When a customer agrees to a time, it appears here.</div>'}
  ${waiting.length || requested.length ? `<div class="daygroup"><h3>Waiting for a time <span class="count">${waiting.length + requested.length}</span></h3>${[...waiting, ...requested].map((l) => `<div class="item" data-open="${l.id}"><div class="avatar">${esc(initials(l.name))}</div><div class="grow"><div class="t">${esc(l.name)} <span class="mute" style="font-weight:500">${esc(projectLine(l))}</span></div><div class="s">${l.callback_text ? `They said: "${esc(l.callback_text)}"` : 'No time agreed yet'}</div></div><span class="btn sm primary">Open</span></div>`).join('')}</div>` : ''}

}

    <div><label class="f">"Active" means starting within (months)</label><input id="within" type="number" min="0" value="${q.active_within_months}"><div class="help">Good-fit customers who start later go to "Nurture".</div></div></div>
    <div class="grid2"><div><label class="f">Cities you work in</label><textarea id="cities" placeholder="Pune, Mumbai. Leave empty for anywhere.">${esc(q.service_cities.join(', '))}</textarea></div><div><label class="f">Types of project</label><textarea id="ptypes">${esc(q.project_types.join(', '))}</textarea></div></div>
    <label class="f">The assistant must find out</label><div class="chk" id="req">${[['project_type', 'What they want'], ['city', 'City'], ['budget', 'Budget'], ['timeline', 'When they want to start']].map(([f, l]) => `<label><input type="checkbox" value="${f}" ${q.required.includes(f) ? 'checked' : ''}> ${l}</label>`).join('')}</div>
    <div class="grid2"><div><label class="f">Currency</label><select id="cur">${['INR', 'USD', 'EUR', 'GBP', 'AED'].map((x) => `<option ${x === c ? 'selected' : ''}>${x}</option>`).join('')}</select></div>
    <div><label class="f">Tell people about the minimum?</label><select id="reveal"><option value="0" ${SET().agent.reveal_minimum ? '' : 'selected'}>No, keep it private</option><option value="1" ${SET().agent.reveal_minimum ? 'selected' : ''}>Yes, mention it politely</option></select></div></div>
    <div class="row" style="margin-top:20px"><button class="btn primary" id="saveBar">Save</button><button class="btn" id="applyBar">Save and re-sort my current leads</button></div></div>
  <div class="card"><h2>What would change?</h2><div class="help">A live preview of how your current leads would be sorted with the numbers above. Nothing changes until you save.</div><div id="whatif" style="margin-top:14px"></div></div></div>`;
  const patch = () => ({ qualification: { min_budget: Number(val('minNum')) || 0, borderline_pct: Number(val('band')) || 0, active_within_months: Number(val('within')) || 0, required: [...document.querySelectorAll('#req input:checked')].map((i) => i.value), service_cities: lines(val('cities')), project_types: lines(val('ptypes')), currency: val('cur') }, agent: { reveal_minimum: val('reveal') === '1' } });
  let t; const preview = () => { clearTimeout(t); t = setTimeout(act(async () => drawWhatIf(await api('/api/settings/preview', { method: 'POST', body: { patch: patch(), includeSim: state.includeSim } }))), 250); };
  $('#minRange').oninput = (e) => { const v = Number(e.target.value) * unit; $('#minNum').value = v; $('#minShow').textContent = money(v); preview(); };
  $('#minNum').oninput = (e) => { $('#minRange').value = Number(e.target.value) / unit; $('#minShow').textContent = money(Number(e.target.value)); preview(); };
  ['band', 'within', 'cities', 'cur'].forEach((id) => { $('#' + id).oninput = preview; }); $('#req').onchange = preview;
  $('#saveBar').onclick = act(async () => { await saveSettings(patch(), 'Saved'); tabRules(); });
  $('#applyBar').onclick = act(async () => { await saveSettings(patch()); const r = await api('/api/settings/reevaluate', { method: 'POST', body: {} }); toast(`Saved. ${r.moved} lead(s) moved.`); tabRules(); });
  preview();
}
function drawWhatIf(r) {
  const el = $('#whatif'); if (!el) return;
  if (!r.total) { el.innerHTML = '<div class="empty"><b>No leads yet</b>Once you have some leads, drag the slider and watch them move.</div>'; return; }
  const bar = (m) => `<div class="stackbar">${STAGES.filter((s) => m[s]).map((s) => `<div style="flex:${m[s]};background:${stageVar(s)}" title="${S[s].label}: ${m[s]}">${m[s]}</div>`).join('')}</div>`;
  el.innerHTML = `<div class="help" style="margin-bottom:6px">Right now (${r.total} leads)</div>${bar(r.before)}<div class="help" style="margin:14px 0 6px">With these numbers</div>${bar(r.after)}
    <div class="row" style="margin-top:10px;gap:14px">${STAGES.map((s) => `<span class="help"><span class="dot" style="background:${stageVar(s)}"></span> ${S[s].label}</span>`).join('')}</div>
    <div style="margin-top:16px"><b>${r.moved.length}</b> lead${r.moved.length === 1 ? '' : 's'} would move</div>
    <div class="moved">${r.moved.map((m) => `<div><b>${esc(m.name)}</b> ${m.budget != null ? `(${esc(money(m.budget))})` : ''}: ${S[m.from].label} &rarr; <span class="pill ${m.to}">${S[m.to].label}</span></div>`).join('')}</div>`;
}

// ---------- live updates ----------
let refreshTimer;
function connectStream() {
  const es = new EventSource('/api/stream');
  es.onmessage = (m) => {
    let ev = {}; try { ev = JSON.parse(m.data); } catch { return; }
    clearTimeout(refreshTimer);
    refreshTimer = setTimeout(async () => {
      try {
        if (ev.type === 'sim') { state.sim = await api('/api/sim/state'); renderSim(); }
        const typing = ['INPUT', 'TEXTAREA', 'SELECT'].includes(document.activeElement && document.activeElement.tagName);
        if (state.view === 'today') viewToday();
        else if (state.view === 'leads' && !typing) viewLeads();
        else if (state.view === 'calls') viewCalls();
        else if (state.view === 'chat') refreshChat();
        else await loadLeads();
        if (state.openLead && (!ev.leadId || ev.leadId === state.openLead) && !typing) openLead(state.openLead, { soft: true });
      } catch { /* retried on the next event */ }
    }, 400);
  };
}

// ---------- login / boot ----------
function showLogin() { $('#login').style.display = 'flex'; $('#pw').focus(); }
$('#loginBtn').onclick = async () => {
  try {
    const r = await fetch('/api/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ password: $('#pw').value }) });
    if (!r.ok) throw new Error((await r.json()).error || 'Wrong password');
    $('#login').style.display = 'none'; start();
  } catch (e) { $('#loginErr').textContent = e.message; }
};
$('#pw').onkeydown = (e) => { if (e.key === 'Enter') $('#loginBtn').click(); };
async function start() {
  await refreshBoot(); await loadLeads(); renderNav(); connectStream();
  const m = location.hash.match(/lead=(\d+)/);
  await render(); if (m) openLead(Number(m[1]));
}
(async () => { const me = await fetch('/api/me').then((r) => r.json()); if (me.admin) start(); else showLogin(); })();
</script>
