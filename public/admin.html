<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lead Funnel Console</title>
<style>
  :root {
    --bg:#f5f3ef; --panel:#fff; --ink:#1c1a17; --mute:#756f66; --line:#e6e1d8; --soft:#faf8f4;
    --side:#1b1916; --side-ink:#d9d3c8; --accent:#b4542d; --accent-ink:#fff;
    --new:#7a7f8a; --qualifying:#3b6fd4; --active:#23865a; --nurture:#c98a12; --disqualified:#b84040; --human:#8a4fc4;
    --radius:12px; --shadow:0 1px 2px rgba(0,0,0,.04), 0 6px 22px rgba(0,0,0,.05);
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#12100e; --panel:#1c1a17; --ink:#efebe3; --mute:#9d968a; --line:#322e28; --soft:#211e1a; --side:#0c0b0a; --accent:#d8744a; --accent-ink:#1a0f09;
      --new:#9aa0ac; --qualifying:#6b97f0; --active:#43b883; --nurture:#e2a936; --disqualified:#e07070; --human:#b585ec; --shadow:none; }
  }
  * { box-sizing:border-box; }
  html,body { height:100%; }
  body { margin:0; background:var(--bg); color:var(--ink); font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; display:flex; }
  button { font:inherit; cursor:pointer; }
  input,select,textarea { font:inherit; color:var(--ink); background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:8px 10px; width:100%; outline:none; }
  input:focus,select:focus,textarea:focus { border-color:var(--accent); box-shadow:0 0 0 3px color-mix(in srgb, var(--accent) 20%, transparent); }
  textarea { resize:vertical; min-height:64px; }
  label { display:block; font-size:12px; font-weight:600; color:var(--mute); margin:12px 0 5px; }
  .btn { border:1px solid var(--line); background:var(--panel); color:var(--ink); padding:8px 13px; border-radius:8px; font-weight:600; }
  .btn:hover { border-color:var(--mute); }
  .btn.primary { background:var(--accent); border-color:var(--accent); color:var(--accent-ink); }
  .btn.danger { color:var(--disqualified); }
  .btn.sm { padding:5px 9px; font-size:12px; }
  .btn:disabled { opacity:.5; cursor:not-allowed; }
  h2 { font-size:20px; margin:0; }
  h3 { font-size:15px; margin:0 0 4px; }
  .mute { color:var(--mute); }
  .row { display:flex; gap:12px; align-items:center; flex-wrap:wrap; }
  .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:0 16px; }
  .grid3 { display:grid; grid-template-columns:repeat(3,1fr); gap:0 16px; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); padding:18px; box-shadow:var(--shadow); }
  .badge { display:inline-flex; align-items:center; gap:6px; padding:2px 9px; border-radius:99px; font-size:12px; font-weight:700; color:#fff; }
  .badge.new { background:var(--new); } .badge.qualifying { background:var(--qualifying); } .badge.active { background:var(--active); }
  .badge.nurture { background:var(--nurture); } .badge.disqualified { background:var(--disqualified); } .badge.human { background:var(--human); }
  .dot { width:8px; height:8px; border-radius:50%; display:inline-block; background:var(--mute); }
  .dot.ok { background:var(--active); } .dot.bad { background:var(--disqualified); } .dot.warn { background:var(--nurture); }

  /* layout */
  aside { width:216px; background:var(--side); color:var(--side-ink); display:flex; flex-direction:column; padding:18px 12px; flex-shrink:0; }
  aside .logo { font-weight:800; font-size:15px; padding:2px 10px 16px; color:#fff; letter-spacing:.01em; }
  aside .logo small { display:block; font-weight:500; color:#8f887c; font-size:11px; margin-top:2px; }
  aside nav button { display:flex; width:100%; align-items:center; gap:10px; text-align:left; background:none; border:0; color:inherit; padding:9px 10px; border-radius:8px; font-weight:600; }
  aside nav button:hover { background:rgba(255,255,255,.06); }
  aside nav button.on { background:rgba(255,255,255,.12); color:#fff; }
  aside .foot { margin-top:auto; font-size:12px; padding:10px; color:#8f887c; line-height:1.9; }
  main { flex:1; min-width:0; display:flex; flex-direction:column; height:100vh; overflow:hidden; }
  .top { padding:18px 26px 10px; display:flex; align-items:center; gap:14px; flex-wrap:wrap; }
  .top .grow { flex:1; }
  .content { flex:1; overflow:auto; padding:6px 26px 30px; }
  .toggle { display:inline-flex; align-items:center; gap:7px; font-weight:600; font-size:13px; color:var(--mute); cursor:pointer; }
  .toggle input { width:auto; }

  /* stats */
  .stats { display:grid; grid-template-columns:repeat(auto-fit,minmax(130px,1fr)); gap:12px; margin-bottom:16px; }
  .stat { background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); padding:12px 14px; }
  .stat b { display:block; font-size:24px; line-height:1.1; }
  .stat span { font-size:12px; color:var(--mute); font-weight:600; }

  /* board */
  .board { display:grid; grid-template-columns:repeat(6,minmax(210px,1fr)); gap:12px; align-items:start; min-width:1300px; }
  .col { background:var(--soft); border:1px solid var(--line); border-radius:var(--radius); padding:10px; min-height:140px; }
  .col h4 { margin:2px 4px 10px; font-size:12px; text-transform:uppercase; letter-spacing:.06em; display:flex; justify-content:space-between; align-items:center; }
  .col h4 i { font-style:normal; padding:1px 8px; border-radius:99px; background:var(--line); color:var(--ink); font-size:12px; }
  .col.new h4 { color:var(--new); } .col.qualifying h4 { color:var(--qualifying); } .col.active h4 { color:var(--active); }
  .col.nurture h4 { color:var(--nurture); } .col.disqualified h4 { color:var(--disqualified); } .col.human h4 { color:var(--human); }
  .lead { background:var(--panel); border:1px solid var(--line); border-left:3px solid var(--new); border-radius:10px; padding:10px 11px; margin-bottom:8px; cursor:pointer; transition:transform .12s, box-shadow .12s; }
  .lead:hover { transform:translateY(-1px); box-shadow:var(--shadow); }
  .lead.s-qualifying { border-left-color:var(--qualifying); } .lead.s-active { border-left-color:var(--active); } .lead.s-nurture { border-left-color:var(--nurture); }
  .lead.s-disqualified { border-left-color:var(--disqualified); } .lead.s-human { border-left-color:var(--human); }
  .lead .n { font-weight:700; display:flex; justify-content:space-between; gap:6px; }
  .lead .meta { color:var(--mute); font-size:12px; margin-top:3px; }
  .lead .why { font-size:12px; margin-top:6px; color:var(--mute); border-top:1px dashed var(--line); padding-top:6px; }
  .lead .tags { display:flex; flex-wrap:wrap; gap:4px; margin-top:6px; }
  .tag { font-size:11px; background:var(--soft); border:1px solid var(--line); padding:1px 7px; border-radius:6px; color:var(--mute); font-weight:600; }
  .tag.sim { color:var(--human); border-color:var(--human); }
  .score { font-size:11px; font-weight:800; padding:1px 6px; border-radius:6px; background:var(--soft); border:1px solid var(--line); }
  .empty { color:var(--mute); text-align:center; padding:20px 6px; font-size:12px; }

  /* table */
  table { width:100%; border-collapse:collapse; background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); overflow:hidden; }
  th,td { padding:9px 12px; text-align:left; border-bottom:1px solid var(--line); font-size:13px; vertical-align:middle; }
  th { font-size:11px; text-transform:uppercase; letter-spacing:.06em; color:var(--mute); background:var(--soft); }
  tr.click { cursor:pointer; } tr.click:hover td { background:var(--soft); }

  /* drawer */
  .scrim { position:fixed; inset:0; background:rgba(0,0,0,.35); display:none; z-index:20; }
  .drawer { position:fixed; top:0; right:0; bottom:0; width:min(620px,100vw); background:var(--bg); border-left:1px solid var(--line); z-index:21; transform:translateX(100%); transition:transform .2s; display:flex; flex-direction:column; }
  .drawer.open { transform:none; } .scrim.open { display:block; }
  .drawer .dh { padding:16px 20px; border-bottom:1px solid var(--line); background:var(--panel); display:flex; gap:12px; align-items:flex-start; }
  .drawer .db { flex:1; overflow:auto; padding:16px 20px 30px; }
  .facts { display:grid; grid-template-columns:1fr 1fr; gap:0 14px; }
  .chat { background:var(--soft); border:1px solid var(--line); border-radius:12px; padding:12px; max-height:360px; overflow:auto; display:flex; flex-direction:column; gap:8px; }
  .msg { max-width:82%; padding:8px 11px; border-radius:12px; white-space:pre-wrap; word-wrap:break-word; font-size:13.5px; }
  .msg.in { align-self:flex-start; background:var(--panel); border:1px solid var(--line); }
  .msg.out { align-self:flex-end; background:var(--accent); color:var(--accent-ink); }
  .msg.admin { align-self:flex-end; background:var(--human); color:#fff; }
  .msg small { display:block; opacity:.7; font-size:10.5px; margin-top:3px; }
  .msg.pending { opacity:.6; } .msg.failed { outline:2px solid var(--disqualified); }
  .events { font-size:12px; color:var(--mute); }
  .events div { padding:5px 0; border-bottom:1px dashed var(--line); }
  .sec { margin-top:20px; }
  .sec > h3 { margin-bottom:8px; }

  /* settings */
  .tabs { display:flex; gap:4px; border-bottom:1px solid var(--line); margin-bottom:16px; flex-wrap:wrap; }
  .tabs button { background:none; border:0; padding:9px 14px; font-weight:600; color:var(--mute); border-bottom:2px solid transparent; }
  .tabs button.on { color:var(--ink); border-bottom-color:var(--accent); }
  input[type=range] { padding:0; border:0; box-shadow:none; accent-color:var(--accent); }
  .big { font-size:34px; font-weight:800; letter-spacing:-.02em; }
  .bar { display:flex; height:26px; border-radius:8px; overflow:hidden; background:var(--line); }
  .bar div { display:flex; align-items:center; justify-content:center; color:#fff; font-size:11px; font-weight:700; min-width:0; transition:flex .3s; }
  .moved { max-height:150px; overflow:auto; font-size:12.5px; margin-top:8px; }
  .moved div { padding:3px 0; }
  .toast { position:fixed; bottom:20px; left:50%; transform:translateX(-50%); background:#222; color:#fff; padding:10px 16px; border-radius:10px; z-index:50; display:none; font-weight:600; max-width:90vw; }
  .login { position:fixed; inset:0; background:var(--bg); z-index:60; display:none; align-items:center; justify-content:center; padding:16px; }
  .login .card { width:100%; max-width:340px; }
  .chk { display:flex; flex-wrap:wrap; gap:6px 16px; }
  .chk label { display:flex; align-items:center; gap:6px; margin:4px 0; font-size:13px; color:var(--ink); font-weight:500; }
  .chk input { width:auto; }
  .pill-ok { color:var(--active); font-weight:700; } .pill-bad { color:var(--disqualified); font-weight:700; }
  code { background:var(--soft); border:1px solid var(--line); padding:1px 6px; border-radius:5px; font-size:12px; word-break:break-all; }
  pre { background:var(--soft); border:1px solid var(--line); padding:10px; border-radius:8px; overflow:auto; font-size:12px; }
  @media (max-width:860px) { aside { width:60px; } aside .logo small, aside nav span, aside .foot { display:none; } .facts,.grid2,.grid3 { grid-template-columns:1fr; } .content { padding:6px 12px 30px; } .top { padding:14px 12px 8px; } }
</style>
</head>
<body>
<div class="login" id="login">
  <div class="card">
    <h2 style="margin-bottom:4px">Lead Funnel Console</h2>
    <p class="mute" style="margin:0 0 10px">Sign in to continue.</p>
    <label for="pw">Admin password</label>
    <input id="pw" type="password" autocomplete="current-password">
    <div id="loginErr" style="color:var(--disqualified);min-height:20px;margin-top:8px"></div>
    <button class="btn primary" style="width:100%;margin-top:6px" id="loginBtn">Sign in</button>
  </div>
</div>

<aside>
  <div class="logo">Lead Funnel<small>AI qualification console</small></div>
  <nav id="nav"></nav>
  <div class="foot" id="foot"></div>
</aside>
<main>
  <div class="top"><h2 id="title"></h2><div class="grow"></div><div id="topActions" class="row"></div></div>
  <div class="content" id="view"></div>
</main>
<div class="scrim" id="scrim"></div>
<div class="drawer" id="drawer"></div>
<div class="toast" id="toast"></div>

<script>
'use strict';
const $ = (s, r = document) => r.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const STAGES = ['new', 'qualifying', 'active', 'nurture', 'disqualified', 'human'];
const LABEL = { new: 'New', qualifying: 'Qualifying', active: 'Active', nurture: 'Nurtured', disqualified: 'Disqualified', human: 'Needs human' };
const BLURB = { new: 'Awaiting first reply', qualifying: 'AI is asking questions', active: 'Qualified, ready for a designer', nurture: 'Good fit, not now', disqualified: 'Below the bar or not a fit', human: 'A person should take over' };
const state = { view: 'pipeline', settingsTab: 'bar', boot: null, leads: [], stats: null, includeSim: true, openLead: null, chatLeadId: null, sim: null, filter: '' };

// ---------- api ----------
async function api(path, opts = {}) {
  const res = await fetch(path, { method: opts.method || 'GET', headers: opts.body ? { 'Content-Type': 'application/json' } : {}, body: opts.body ? JSON.stringify(opts.body) : undefined });
  if (res.status === 401) { showLogin(); throw new Error('Not signed in'); }
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || `Request failed (${res.status})`);
  return data;
}
let toastTimer;
function toast(msg, bad) {
  const t = $('#toast'); t.textContent = msg; t.style.display = 'block'; t.style.background = bad ? '#b84040' : '#222';
  clearTimeout(toastTimer); toastTimer = setTimeout(() => { t.style.display = 'none'; }, 2800);
}
const act = (fn) => async (...a) => { try { await fn(...a); } catch (e) { toast(e.message, true); } };

// ---------- formatting ----------
function money(n) {
  if (n === null || n === undefined || n === '') return 'n/a';
  const cur = state.boot ? state.boot.settings.qualification.currency : 'INR';
  n = Number(n);
  const t = (x) => String(Math.round(x * 100) / 100);
  if (cur === 'INR') { if (n >= 1e7) return `₹${t(n / 1e7)}Cr`; if (n >= 1e5) return `₹${t(n / 1e5)}L`; if (n >= 1e3) return `₹${t(n / 1e3)}k`; return `₹${n}`; }
  const sym = { USD: '$', EUR: '€', GBP: '£' }[cur] || cur + ' ';
  if (n >= 1e6) return `${sym}${t(n / 1e6)}M`; if (n >= 1e3) return `${sym}${t(n / 1e3)}k`; return `${sym}${n}`;
}
function ago(ts) {
  if (!ts) return '';
  const s = Math.max(1, Math.round((Date.now() - ts) / 1000));
  if (s < 60) return `${s}s ago`; if (s < 3600) return `${Math.round(s / 60)}m ago`; if (s < 86400) return `${Math.round(s / 3600)}h ago`; return `${Math.round(s / 86400)}d ago`;
}
const timeOf = (ts) => new Date(ts).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
const timeline = (l) => l.timeline_text || (l.timeline_months != null ? `${l.timeline_months} mo` : null);

// ---------- shell ----------
const NAV = [['pipeline', 'Pipeline', '▦'], ['leads', 'All leads', '☰'], ['chat', 'Test chat', '☎'], ['sim', 'Simulator', '⚡'], ['settings', 'Settings', '⚙']];
function renderNav() {
  $('#nav').innerHTML = NAV.map(([id, label, icon]) => `<button data-v="${id}" class="${state.view === id ? 'on' : ''}"><b>${icon}</b><span>${label}</span></button>`).join('');
  $('#nav').querySelectorAll('button').forEach((b) => b.onclick = () => go(b.dataset.v));
}
function renderFoot() {
  const s = state.boot && state.boot.status; if (!s) return;
  const tg = s.telegram.enabled ? (s.telegram.connected ? `<span class="dot ok"></span> Telegram @${esc(s.telegram.username || '')}` : '<span class="dot bad"></span> Telegram offline') : '<span class="dot warn"></span> Telegram not set';
  const llm = s.llm.enabled ? `<span class="dot ${s.llm.lastError && !s.llm.lastOkAt ? 'bad' : 'ok'}"></span> AI ready` : '<span class="dot bad"></span> No AI key';
  const ig = s.instagram && s.instagram.enabled ? (s.instagram.connected ? `<span class="dot ok"></span> Instagram @${esc(s.instagram.username || '')}` : '<span class="dot bad"></span> Instagram offline') : '<span class="dot warn"></span> Instagram not set';
  $('#foot').innerHTML = `${ig}<br>${tg}<br>${llm}<br><a href="#" id="logout" style="color:inherit">Sign out</a>`;
  $('#logout').onclick = act(async (e) => { e.preventDefault(); await api('/api/logout', { method: 'POST', body: {} }); location.reload(); });
}
function go(v) { state.view = v; closeDrawer(); renderNav(); render(); }

async function render() {
  const titles = { pipeline: 'Pipeline', leads: 'All leads', chat: 'Test chat', sim: 'Simulator', settings: 'Settings' };
  $('#title').textContent = titles[state.view];
  $('#topActions').innerHTML = '';
  ({ pipeline: viewPipeline, leads: viewLeads, chat: viewChat, sim: viewSim, settings: viewSettings })[state.view]();
}

// ---------- data ----------
async function loadLeads() {
  const q = new URLSearchParams(); if (!state.includeSim) q.set('sim', '0'); if (state.filter) q.set('q', state.filter);
  const [l, s] = await Promise.all([api(`/api/leads?${q}`), api(`/api/stats?${state.includeSim ? '' : 'sim=0'}`)]);
  state.leads = l.leads; state.stats = s;
}
async function refreshBoot() { state.boot = await api('/api/bootstrap'); renderFoot(); }

// ---------- pipeline ----------
function statStrip(s) {
  const c = (id) => s.byStage[id] || 0;
  return `<div class="stats">
    <div class="stat"><b>${s.total}</b><span>Total leads</span></div>
    <div class="stat"><b style="color:var(--active)">${c('active')}</b><span>Active</span></div>
    <div class="stat"><b style="color:var(--nurture)">${c('nurture')}</b><span>Nurtured</span></div>
    <div class="stat"><b style="color:var(--disqualified)">${c('disqualified')}</b><span>Disqualified</span></div>
    <div class="stat"><b>${s.qualified_rate == null ? '-' : s.qualified_rate + '%'}</b><span>Qualified rate</span></div>
    <div class="stat"><b>${s.hours_saved}h</b><span>Screening time saved</span></div>
  </div>`;
}
function leadCard(l) {
  const facts = [l.project_type, l.city].filter(Boolean).join(' / ');
  const tags = [];
  if (l.budget_amount != null) tags.push(`<span class="tag">${money(l.budget_amount)}</span>`);
  if (timeline(l)) tags.push(`<span class="tag">${esc(timeline(l))}</span>`);
  if (l.designer) tags.push(`<span class="tag">${esc(l.designer)}</span>`);
  if (l.ai_paused) tags.push('<span class="tag" style="color:var(--human)">AI paused</span>');
  if (l.channel === 'sim') tags.push('<span class="tag sim">sim</span>');
  if (l.channel === 'instagram') tags.push('<span class="tag">Instagram</span>');
  else if (l.channel === 'telegram') tags.push('<span class="tag">Telegram</span>');
  if (l.stage === 'new' && !l.has_chat) tags.push('<span class="tag">not in chat yet</span>');
  return `<div class="lead s-${l.stage}" data-id="${l.id}">
    <div class="n"><span>${esc(l.name || 'Unknown')}</span><span class="score">${l.score}</span></div>
    <div class="meta">${esc(facts || l.source || '')} &middot; ${ago(l.updated_at)}</div>
    ${tags.length ? `<div class="tags">${tags.join('')}</div>` : ''}
    ${l.stage_reason ? `<div class="why">${esc(l.stage_reason)}</div>` : ''}
  </div>`;
}
async function viewPipeline() {
  $('#topActions').innerHTML = `<label class="toggle"><input type="checkbox" id="simT" ${state.includeSim ? 'checked' : ''}> Include simulated leads</label>
    <button class="btn" id="addLead">+ Add lead</button><a class="btn" href="/api/export.csv">Export CSV</a>`;
  $('#simT').onchange = (e) => { state.includeSim = e.target.checked; render(); };
  $('#addLead').onclick = openAddLead;
  await loadLeads();
  const cols = STAGES.map((st) => {
    const items = state.leads.filter((l) => l.stage === st);
    return `<div class="col ${st}"><h4><span>${LABEL[st]}</span><i>${items.length}</i></h4>
      ${items.length ? items.map(leadCard).join('') : `<div class="empty">${BLURB[st]}</div>`}</div>`;
  }).join('');
  $('#view').innerHTML = statStrip(state.stats) + `<div style="overflow-x:auto"><div class="board">${cols}</div></div>`;
  $('#view').querySelectorAll('.lead').forEach((el) => el.onclick = () => openLead(Number(el.dataset.id)));
}

// ---------- all leads ----------
async function viewLeads() {
  $('#topActions').innerHTML = `<input id="q" placeholder="Search name, phone, city..." style="width:240px" value="${esc(state.filter)}">
    <label class="toggle"><input type="checkbox" id="simT" ${state.includeSim ? 'checked' : ''}> Include simulated</label><a class="btn" href="/api/export.csv">Export CSV</a>`;
  $('#simT').onchange = (e) => { state.includeSim = e.target.checked; render(); };
  let t; $('#q').oninput = (e) => { state.filter = e.target.value; clearTimeout(t); t = setTimeout(renderRows, 250); };
  await renderRows();
  async function renderRows() {
    await loadLeads();
    $('#view').innerHTML = `<table><thead><tr><th>Lead</th><th>Stage</th><th>Project</th><th>Budget</th><th>Timeline</th><th>Score</th><th>Designer</th><th>Updated</th></tr></thead><tbody>
      ${state.leads.map((l) => `<tr class="click" data-id="${l.id}"><td><b>${esc(l.name || 'Unknown')}</b><div class="mute">${esc(l.phone || l.tg_username || '')}</div></td>
      <td><span class="badge ${l.stage}">${LABEL[l.stage]}</span></td><td>${esc([l.project_type, l.city].filter(Boolean).join(' / '))}</td>

function eventText(e) {
  const d = e.data || {};
  if (e.type === 'stage_changed') return `${LABEL[d.from] || d.from} to ${LABEL[d.to] || d.to}${d.reason ? `: ${d.reason}` : ''}`;
  if (e.type === 'facts_updated') return (d.fields || []).join(', ');
  if (e.type === 'designer_assigned') return d.designer;
  if (e.type === 'llm_error' || e.type === 'send_failed') return d.error || '';
  if (e.type === 'followup_sent' || e.type === 'drip_sent') return `#${d.n}`;
  return '';
}

function drawWhatIf(r) {
  const el = $('#whatif'); if (!el) return;
  const bar = (m) => { const tot = Math.max(1, r.total); return `<div class="bar">${STAGES.filter((s) => m[s]).map((s) => `<div style="flex:${m[s]};background:var(--${s})" title="${LABEL[s]}: ${m[s]}">${m[s]}</div>`).join('')}</div>`; };
  const legend = `<div class="row" style="margin-top:8px;gap:10px">${STAGES.map((s) => `<span style="font-size:12px"><span class="dot" style="background:var(--${s})"></span> ${LABEL[s]}</span>`).join('')}</div>`;
  if (!r.total) { el.innerHTML = '<div class="empty">No leads yet. Run the simulator, then come back and drag the slider.</div>'; return; }
  el.innerHTML = `<div class="mute" style="margin-bottom:4px">Now (${r.total} leads)</div>${bar(r.before)}<div class="mute" style="margin:12px 0 4px">With these settings</div>${bar(r.after)}${legend}
    <div style="margin-top:14px"><b>${r.moved.length}</b> lead${r.moved.length === 1 ? '' : 's'} would change category</div>
    <div class="moved">${r.moved.map((m) => `<div><b>${esc(m.name)}</b> ${m.budget != null ? `(${money(m.budget)})` : ''}: ${LABEL[m.from]} &rarr; <span class="badge ${m.to}">${LABEL[m.to]}</span></div>`).join('')}</div>`;
}

// ---------- live updates ----------
let refreshTimer;
function connectStream() {
  const es = new EventSource('/api/stream');
  es.onmessage = (m) => {
    let ev = {}; try { ev = JSON.parse(m.data); } catch { return; }
    clearTimeout(refreshTimer);
    refreshTimer = setTimeout(async () => {
      try {
        if (ev.type === 'sim') { state.sim = await api('/api/sim/state'); renderSim(); }
        if (state.view === 'pipeline') viewPipelineSoft();
        if (state.view === 'leads' && document.activeElement.id !== 'q') viewLeads();
        if (state.view === 'chat') refreshChat();
        if (state.openLead && (!ev.leadId || ev.leadId === state.openLead) && document.activeElement.tagName !== 'TEXTAREA') openLead(state.openLead, { keepScroll: true });
      } catch { /* retried on next event */ }
    }, 350);
  };
}
async function viewPipelineSoft() { const y = $('.content').scrollTop; await viewPipeline(); $('.content').scrollTop = y; }

// ---------- login / boot ----------
function showLogin() { $('#login').style.display = 'flex'; $('#pw').focus(); }
$('#loginBtn').onclick = async () => {
  try {
    const r = await fetch('/api/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ password: $('#pw').value }) });
    if (!r.ok) throw new Error((await r.json()).error || 'Login failed');
    $('#login').style.display = 'none'; start();
  } catch (e) { $('#loginErr').textContent = e.message; }
};
$('#pw').onkeydown = (e) => { if (e.key === 'Enter') $('#loginBtn').click(); };
async function start() {
  await refreshBoot(); renderNav(); connectStream();
  const m = location.hash.match(/lead=(\d+)/);
  render(); if (m) openLead(Number(m[1]));
}
(async () => {
  const me = await fetch('/api/me').then((r) => r.json());
  if (me.admin) start(); else showLogin();
})();
